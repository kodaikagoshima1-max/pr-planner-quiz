<title>PRプランナー1次試験 練習問題集</title>
<style>

.sub{font-size:12px;color:var(--sub)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;letter-spacing:.5px}

select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--txt)}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.warn{background:var(--ng)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;background:#e9ecf1;padding:4px;border-radius:10px;margin-bottom:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--sub);font-family:inherit}
.tabs button.on{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note{font-size:12.5px;color:var(--sub);background:#eef1f5;border-radius:9px;padding:11px 13px;margin:12px 0 0}

.chip{display:inline-block;font-size:11px;color:var(--sub);background:#eef1f5;border-radius:99px;padding:2px 10px;margin-bottom:10px}
.stem{font-size:15.5px;font-weight:600;white-space:pre-wrap;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:14.5px;cursor:pointer;font-family:inherit;line-height:1.65;color:var(--txt)}
.opt:hover:not(:disabled){border-color:#b9c2cf;background:#fafbfc}
.opt b{flex:0 0 auto;color:var(--sub)}
.opt.sel{border-color:var(--accent);background:#f2f6ff;box-shadow:0 0 0 2px rgba(11,95,255,.12)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}

.fb.ok{background:var(--okbg);border:1px solid #b8e6cd}
.fb.ng{background:var(--ngbg);border:1px solid #f6c9c6}

.fb p{margin:0;color:#33404d}

.grid button.ng{background:var(--ngbg);border-color:#f6c9c6;color:var(--ng);font-weight:600}
.hide{display:none}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:26px}

  </div>

</div>

<div id="quiz" class="hide"></div>
<div id="result" class="hide"></div>

const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyOf=q=>Array.isArray(q.answer)?q.answer.join('→'):q.answer;
const isOk=(q,v)=>v==null?false:(Array.isArray(q.answer)?String(v)===q.answer.join():v===q.answer);
const show=(v)=>v==null?'未解答':(Array.isArray(v)?v.join('→'):v);

/* ---------- setup ---------- */
let MODE='practice';
$('tabP').onclick=()=>setMode('practice');
$('tabE').onclick=()=>setMode('exam');
function setMode(m){MODE=m;
  $('tabP').classList.toggle('on',m==='practice'); $('tabE').classList.toggle('on',m==='exam');
  $('paneP').classList.toggle('hide',m!=='practice'); $('paneE').classList.toggle('hide',m!=='exam');}

const chapSel=$('chap');
chapSel.innerHTML='<option value="all">すべて（全100問）</option>'+
  CHAPS.map(c=>`<option value="${c}">${c}（${DATA.filter(q=>q.chapter===c).length}問）</option>`).join('');
function refreshCount(){
  const pool=chapSel.value==='all'?DATA:DATA.filter(q=>q.chapter===chapSel.value);
  const opts=[5,10,20,30,50].filter(n=>n<pool.length);
  $('count').innerHTML=opts.map(n=>`<option value="${n}">${n}問</option>`).join('')+
    `<option value="${pool.length}">全${pool.length}問</option>`;
  $('count').value=String(opts.includes(10)?10:pool.length);
}
chapSel.onchange=refreshCount; refreshCount();

/* 章バランスを取って抽出 */
function stratified(n){
  const byCh={}; CHAPS.forEach(c=>byCh[c]=shuffle(DATA.filter(q=>q.chapter===c)));
  const out=[]; let i=0;
  while(out.length<n){
    let added=false;
    for(const c of CHAPS){ if(out.length>=n) break;
      if(byCh[c][i]){ out.push(byCh[c][i]); added=true; } }
    if(!added) break; i++;
  }
  return shuffle(out);
}

/* ---------- state ---------- */
let Q=[],i=0,picked=[],flags=[],graded=false,locked=false,seq=[],limit=0,deadline=0,tick=null;

$('start').onclick=()=>{
  if(MODE==='practice'){
    let pool=chapSel.value==='all'?DATA.slice():DATA.filter(q=>q.chapter===chapSel.value);
    pool=$('order').value==='rand'?shuffle(pool):pool.slice().sort((a,b)=>a.no-b.no);
    Q=pool.slice(0,+$('count').value); limit=0;
  }else{
    const [n,m]=$('eset').value.split('|').map(Number);
    Q=stratified(Math.min(n,DATA.length)); limit=m;
  }
  i=0; picked=new Array(Q.length).fill(null); flags=new Array(Q.length).fill(false); graded=false;
  $('setup').classList.add('hide'); $('result').classList.add('hide');
  $('quiz').classList.remove('hide'); $('bar').classList.remove('hide');
  if(MODE==='exam'&&limit>0) startTimer(limit*60); else stopTimer();
  render();
};

  clearInterval(tick); tick=setInterval(paint,250);

    let r=Math.max(0,Math.round((deadline-Date.now())/1000));
    const t=$('timer');
    t.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
    t.className='timer'+(r<=300?' dan':r<=600?' warn':'');
    if(r<=0){ clearInterval(tick); finish(true); }
  }
}
function stopTimer(){clearInterval(tick); $('timer').classList.add('hide');}

/* ---------- render ---------- */
function render(){
  const q=Q[i]; locked=false; seq=Array.isArray(picked[i])?picked[i].slice():[];
  const answered=picked.filter(v=>v!=null).length;
  $('bar').firstElementChild.style.width=((MODE==='exam'?answered:i)/Q.length*100)+'%';
  const correct=MODE==='practice'?picked.filter((v,n)=>v!=null&&isOk(Q[n],v)).length:0;
  const done=MODE==='practice'?picked.filter(v=>v!=null).length:0;

  let body='';
  if(q.type==='single'){
    body=Object.entries(q.choices).map(([k,v])=>
      `<button class="opt" data-k="${k}"><b>${k}.</b><span>${esc(v)}</span></button>`).join('');
  }else{
    const label=q.type==='order'?'古い順に選んでください（選んだ順に並びます）':'①→②→③→④の順に選んでください';
    body=`<div class="sub" style="margin-bottom:4px">${label}</div>
      <div class="seq" id="seq"><span class="ph">未選択</span></div>
      ${q.type==='assign'?'<div class="slot" id="slot"></div>':''}
      ${Object.entries(q.choices).map(([k,v])=>
        `<button class="opt" data-k="${k}"><b>${k}.</b><span>${esc(v)}</span></button>`).join('')}
      <div class="row" style="margin-top:6px"><button class="btn ghost sm" id="undo">1つ戻す</button></div>`;
  }

  const nav = MODE==='exam' ? `
    <div class="row" style="margin-top:16px">
      <button class="btn ghost sm" id="prev" ${i===0?'disabled':''}>← 前の問題</button>
      <button class="btn ghost sm" id="flag">${flags[i]?'★ 見直す（解除）':'☆ あとで見直す'}</button>
      <button class="btn ghost sm" id="nx" ${i===Q.length-1?'disabled':''}>次の問題 →</button>
      <span style="flex:1"></span>
      <button class="btn warn sm" id="submit">採点する（${answered}/${Q.length}）</button>
    </div>
    <div class="sub" style="margin-top:18px">問題一覧（タップで移動）</div>
    <div class="grid" id="grid"></div>` : `
    <div class="row" style="margin-top:16px">
      <button class="btn" id="next" disabled>${i===Q.length-1?'結果を見る':'次の問題へ'}</button>
      <button class="btn ghost sm" id="quit">中断して設定に戻る</button>
    </div>`;

  $('quiz').innerHTML=`<div class="card">
    <div class="meta"><span>第 ${i+1} / ${Q.length} 問（問${q.no}）</span>
      <span>${MODE==='exam'?'解答済 '+answered+' / '+Q.length:'正解 '+correct+' / '+done}</span></div>
    <span class="chip">${esc(q.chapter)}</span>
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${body}</div>
    <div id="fb"></div>
    ${nav}</div>`;

  $('quiz').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.k));
  if($('undo')) $('undo').onclick=()=>{if(locked)return;seq.pop();picked[i]=seq.length?seq.slice():null;drawSeq()};
  if(MODE==='exam'){
    $('prev').onclick=()=>{i--;render()};
    $('nx').onclick=()=>{i++;render()};
    $('flag').onclick=()=>{flags[i]=!flags[i];render()};
    $('submit').onclick=()=>{
      const un=picked.filter(v=>v==null).length;
      if(un&&!confirm('未解答が'+un+'問あります。採点しますか？')) return;
      finish(false);
    };
    drawGrid();
    if(q.type==='single'&&picked[i]) $('quiz').querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.dataset.k===picked[i]));
  }else{
    $('next').onclick=()=>{i++; i<Q.length?render():finish(false)};
    $('quit').onclick=()=>{$('quiz').classList.add('hide');$('setup').classList.remove('hide');$('bar').classList.add('hide');stopTimer()};
  }
  if(q.type!=='single') drawSeq();
  window.scrollTo({top:0,behavior:'smooth'});
}

function drawGrid(){
  $('grid').innerHTML=Q.map((q,n)=>
    `<button data-n="${n}" class="${picked[n]!=null?'done':''} ${flags[n]?'flag':''} ${n===i?'cur':''}">${n+1}</button>`).join('');
  $('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.n;render()});
}

function drawSeq(){
  const q=Q[i];
  $('seq').innerHTML = seq.length? seq.map((k,n)=>`<span class="tag">${q.type==='assign'?q.slots[n]:(n+1)} ${k}</span>`).join('')
    : '<span class="ph">未選択</span>';
  if(q.type==='assign'&&$('slot')) $('slot').textContent = seq.length<4? `次に選ぶのは ${q.slots[seq.length]} です`:'';
  $('quiz').querySelectorAll('.opt').forEach(b=>{b.disabled=locked||seq.includes(b.dataset.k);b.classList.toggle('sel',seq.includes(b.dataset.k))});
  if(seq.length===4){ picked[i]=seq.slice(); if(MODE==='practice'&&!locked) judge(); else if(MODE==='exam') drawGrid(); }
}

function choose(k){
  if(locked) return;
  const q=Q[i];
  if(q.type==='single'){
    picked[i]=k;
    if(MODE==='practice'){ judge(); }
    else { $('quiz').querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.dataset.k===k)); drawGrid();
           $('submit').textContent='採点する（'+picked.filter(v=>v!=null).length+'/'+Q.length+'）'; }
  } else { if(!seq.includes(k)) seq.push(k); drawSeq(); }
}

function judge(){
  locked=true;
  const q=Q[i], v=picked[i], ok=isOk(q,v);
  $('quiz').querySelectorAll('.opt').forEach(b=>{
    b.disabled=true; b.classList.remove('sel');
    if(q.type==='single'){
      if(b.dataset.k===q.answer) b.classList.add('ok');
      else if(b.dataset.k===v) b.classList.add('ng');
    }});
  if(q.type!=='single') $('seq').style.borderColor = ok?'#0a8f4d':'#d92d20';
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}">
    <h4>${ok?'正解':'不正解'}　正答：${esc(keyOf(q))}${ok?'':'（あなたの解答：'+esc(show(v))+'）'}</h4>
    <p>${esc(q.explanation)}</p></div>`;
  $('next').disabled=false;
}

/* ---------- result ---------- */
function finish(timeUp){
  stopTimer(); graded=true;
  const res=Q.map((q,n)=>({q,v:picked[n],ok:isOk(q,picked[n])}));
  const c=res.filter(r=>r.ok).length, total=res.length, r=Math.round(c/total*100);
  const wrong=res.filter(x=>!x.ok);
  const byCh={};
  res.forEach(x=>{byCh[x.q.chapter]=byCh[x.q.chapter]||[0,0];byCh[x.q.chapter][1]++;if(x.ok)byCh[x.q.chapter][0]++});
  const exam=MODE==='exam';
  const pass=c/total>=PASS;
  $('quiz').classList.add('hide'); $('bar').classList.add('hide');
  $('result').classList.remove('hide');
  $('result').innerHTML=`<div class="card">
    <div class="sub">${exam?'模擬試験の結果':'結果'}${timeUp?'（制限時間に達したため自動採点）':''}</div>
    <div class="score">${c} / ${total}　<span style="font-size:18px">正答率 ${r}%</span>
      ${exam?`<span class="verdict ${pass?'p':'f'}">${pass?'合格ライン到達':'合格ライン未満'}</span>`:''}</div>
    <div class="bar" style="margin:10px 0 6px"><i style="width:${r}%"></i></div>
    ${exam?`<div class="sub" style="margin-bottom:14px">合格基準は正答率70%（本番と同じ）／未解答 ${res.filter(x=>x.v==null).length}問</div>`:''}
    <div class="sub" style="margin-bottom:6px">章別</div>
    <ul class="list">${Object.entries(byCh).sort((a,b)=>parseInt(a[0])-parseInt(b[0]))
      .map(([k,v])=>`<li>${esc(k)}：<b>${v[0]}/${v[1]}</b>　${v[0]<v[1]*0.7?'<span style="color:var(--ng)">要復習</span>':''}</li>`).join('')}</ul>
    <div class="row" style="margin-top:14px">
      ${wrong.length?`<button class="btn" id="review">間違えた問題だけ復習する（${wrong.length}問）</button>`:''}
      <button class="btn ghost" id="again">設定に戻る</button></div></div>
    ${wrong.length?`<div class="card"><div class="sub" style="margin-bottom:8px">間違えた問題と解説</div>
      <ul class="list">${wrong.map(x=>`<li><b>問${x.q.no}</b>　${esc(x.q.stem.split('\n')[0])}<br>
        <span style="color:var(--ng)">あなた：${esc(show(x.v))}</span>　
        <span style="color:var(--ok)">正答：${esc(keyOf(x.q))}</span><br>
        <span style="color:var(--sub)">${esc(x.q.explanation)}</span></li>`).join('')}</ul></div>`:''}`;
  if($('review')) $('review').onclick=()=>{
    MODE='practice'; setMode('practice'); Q=wrong.map(x=>x.q); i=0;
    picked=new Array(Q.length).fill(null); flags=new Array(Q.length).fill(false); limit=0;
    $('result').classList.add('hide');$('quiz').classList.remove('hide');$('bar').classList.remove('hide');render()};
  $('again').onclick=()=>{$('result').classList.add('hide');$('setup').classList.remove('hide')};
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
